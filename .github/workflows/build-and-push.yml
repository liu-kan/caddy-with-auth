name: Build&Push Release Docker Image

on:
  push:
    tags:
      - "*"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Base Docker image tag (without -dev; publishes both variants)"
        type: string
        required: false
        default: "manual"
jobs:
  send-tg-msg:
    name: Send TG message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: info
          notify_fields: "repository,branch,commit,workflow"
          title: "Build started."

  build-docker-image:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.image_tag || 'manual') || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USER }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build and export dependency reports
        uses: docker/build-push-action@v7
        with:
          context: .
          target: security-reports
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          build-args: |
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false
          outputs: type=local,dest=security-reports

      - name: Upload dependency reports
        uses: actions/upload-artifact@v7
        with:
          name: caddy-dependency-security-reports
          path: security-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Build runtime regression image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          platforms: linux/amd64
          pull: true
          build-args: |
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false
          load: true
          tags: caddy-with-auth:ci-regression

      - name: Check Coraza CVE regressions
        run: python3 tests/test_coraza_cves.py caddy-with-auth:ci-regression

      - name: Build and push runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          pull: true
          build-args: |
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64,linux/arm64/v8
          provenance: false
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/caddy-with-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/caddy-with-auth:${{ env.IMAGE_TAG }}

      - name: Build and push dev
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final-dev
          pull: true
          build-args: |
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64,linux/arm64/v8
          provenance: false
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/caddy-with-auth:latest-dev
            ${{ secrets.DOCKERHUB_USERNAME }}/caddy-with-auth:${{ env.IMAGE_TAG }}-dev

  send-finish-tg-msg:
    name: Send TG message
    needs: [build-docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: ${{ job.status }}
          notify_fields: "repository,branch,commit"
          title: "Build finished."

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build-docker-image]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send error notification
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: failure
          notify_fields: "repository,branch,commit,workflow"
          title: "Build failed."
