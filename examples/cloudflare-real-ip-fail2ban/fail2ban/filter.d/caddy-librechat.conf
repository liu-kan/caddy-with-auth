# Caddy JSONL；只统计账号密码登录失败，IPv4/IPv6 都由 <ADDR> 提取。
# 登录/重置页面的成功请求、refresh、register 和重置密码接口不会触发此规则。
# LibreChat requireLocalAuth 对密码错误/用户不存在返回 404；401/429 也按登录失败统计。
[Definition]
failregex = ^\{.*"logger":"http\.log\.access\.login".*"request":\{"remote_ip":"(?P<edge>[^"]+)"[^}]*"client_ip":"(?!(?P=edge)")<ADDR>"[^}]*"method":"POST"[^}]*"uri":"/api/auth/login(?:\?[^"]*)?".*"status":(?:401|404|429)\b
ignoreregex =
datepattern = "ts":{Epoch}
